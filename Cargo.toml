[workspace]
resolver = "2"
members = [
    "crates/vettd-skill-scanner",
    "crates/http-shim",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
yaml-rust2 = { version = "0.12", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# v0.12's published MSRV is inaccurate: it uses let-chains unavailable on
# the repo's pinned Rust 1.85.1. v0.11 declares Rust 1.73 and supports it.
tiktoken-rs = "=0.11.0"
